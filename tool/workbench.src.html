<title>読解オントロジー工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 作品一覧 → 作業台。作業台は左に本文（明朝・スクロール枠・選択バー付き）、右に種類ごとのタブとカード。狭い画面では本文を上に固定して積む。 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e6ebe9; --ink:#17201d; --muted:#5a6863; --line:#cbd4d0; --line-strong:#8d9a95;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#d5ebe6; --hl:#ffe08a; --hl-ink:#17201d; --bad:#b3261e; --warn:#8a5a00;
  --c-E:#1f5fae; --c-M:#b0372b; --c-D:#7a4b9c; --c-Q:#8a5a00; --c-P:#0f6b5c;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-text:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#0c110f; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2b3633; --line-strong:#5d6c67;
  --accent:#5fd0b8; --accent-ink:#08201b; --accent-soft:#16312b; --hl:#7a5c00; --hl-ink:#fff6d6; --bad:#ff8a80; --warn:#e8b85a;
  --c-E:#86b4f5; --c-M:#f08f82; --c-D:#c49be6; --c-Q:#e8b85a; --c-P:#5fd0b8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#0c110f; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2b3633; --line-strong:#5d6c67;
  --accent:#5fd0b8; --accent-ink:#08201b; --accent-soft:#16312b; --hl:#7a5c00; --hl-ink:#fff6d6; --bad:#ff8a80; --warn:#e8b85a;
  --c-E:#86b4f5; --c-M:#f08f82; --c-D:#c49be6; --c-Q:#e8b85a; --c-P:#5fd0b8; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.narrow{max-width:760px}
header.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
h1{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.grow{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 9px;max-width:100%;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.7}
.btn{font-size:14px;padding:6px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{font-size:12px;padding:2px 9px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.dash{background:none;border-style:dashed}
.msg{font-size:14px;padding:7px 12px;border-left:3px solid var(--bad);background:var(--sunk)}
.msg.ok{border-color:var(--accent)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.work{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.work b{font-family:var(--f-text);font-size:18px}
.counts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label,.flab{font-size:12px;font-weight:700;color:var(--muted)}
.steps{margin:0;padding-left:1.3em;font-size:14px;display:flex;flex-direction:column;gap:2px}

.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.text{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;max-height:calc(100vh - 20px)}
.text-head{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.text-head b{font-family:var(--f-text);font-size:17px}
.selbar{padding:8px 14px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px;min-height:2.6em}
.selbar.has{background:var(--accent-soft)}
.text-head,.selbar{flex:none}
.selq{font-family:var(--f-text);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paras{overflow-y:auto;padding:10px 14px 24px;font-family:var(--f-text);font-size:16px;line-height:2;display:flex;flex-direction:column;gap:4px}
.para{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px}
.para .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;padding:6px 2px 0 0;background:none;border:0;align-self:start;line-height:1.6}
.para .no:hover{color:var(--accent);text-decoration:underline}
.scene-lab{grid-column:1/-1;display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line-strong);margin-top:8px;padding-top:6px;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.scene-lab input{font-size:12px;padding:1px 6px;font-weight:700;flex:1}
.tags{display:inline-flex;gap:3px;margin-left:6px;vertical-align:2px;user-select:none;-webkit-user-select:none}
mark{background:var(--hl);color:var(--hl-ink);padding:2px 0;border-radius:2px}
.tg{font-family:var(--f-mono);font-size:10px;line-height:1.5;padding:0 4px;border:1px solid var(--c);color:var(--c);background:none;border-radius:3px}
@media (max-width:860px){ .bench{grid-template-columns:minmax(0,1fr)} .text{max-height:48vh;top:env(safe-area-inset-top,0px);z-index:5} }
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-size:13px;padding:4px 12px;border:1.5px solid var(--c,var(--line-strong));background:var(--surface);border-radius:99px}
.tab[aria-selected="true"]{background:var(--c,var(--ink));color:var(--surface);border-color:var(--c,var(--ink));font-weight:700}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.85}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.on{outline:2px solid var(--c)}
.card.form{background:var(--surface);border:2px solid var(--c)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.card-h b{font-size:16px;overflow-wrap:anywhere}
.id{font-family:var(--f-mono);font-size:11px;color:var(--c);border:1px solid var(--c);border-radius:3px;padding:0 5px;line-height:1.6}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:0 8px;border:1px solid var(--line-strong);color:var(--muted);line-height:1.7}
.chain{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.chain dt{color:var(--muted);font-size:12px;padding-top:2px}
.chain dd{margin:0;overflow-wrap:anywhere}
.none{color:var(--bad);font-size:13px}
.q{font-family:var(--f-text);font-size:14px;text-align:left;background:var(--sunk);border:0;border-left:2px solid var(--line-strong);padding:4px 10px;width:100%;line-height:1.7;display:flex;gap:6px;align-items:baseline}
.q .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.q span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.qx{display:flex;gap:4px;align-items:stretch}
.interp::before{content:"解釈";font-size:11px;font-weight:700;color:var(--c-D);border:1px solid var(--c-D);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:1px}
.lk{font-size:13px;padding:1px 8px;border:1px solid var(--c);background:none;border-radius:4px;text-align:left;overflow-wrap:anywhere}
.lk .i{font-family:var(--f-mono);font-size:11px;color:var(--c);margin-right:4px}
.ans{font-size:15px;padding:8px 12px;background:var(--accent-soft);border:1px solid var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.checks{display:flex;flex-direction:column;gap:4px;max-height:11em;overflow:auto;border:1px solid var(--line);padding:6px 10px}
.checks label{font-size:14px;display:flex;gap:6px;align-items:baseline}
.iss{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.lv{font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:3px;text-align:center;line-height:1.7}
.lv.a{color:var(--bad)} .lv.b{color:var(--warn)} .lv.c{color:var(--muted)}
.stat{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:13px}
.stat b{font-size:20px;font-family:var(--f-display)}
.empty{font-size:14px;color:var(--muted);border:1px dashed var(--line-strong);padding:14px}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cnt.over{color:var(--bad);font-weight:700}
.ocr{border:1px dashed var(--line-strong);padding:12px;display:flex;flex-direction:column;gap:8px}
.ocr.drag{border-color:var(--accent);background:var(--accent-soft)}
.imgs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:im}
.imgs li{counter-increment:im;display:flex;gap:8px;align-items:center;font-size:13px}
.imgs li::before{content:counter(im) "枚目";font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.imgs img{width:34px;height:44px;object-fit:cover;border:1px solid var(--line);flex:none}
.imgs span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<div class="wrap" id="app"></div>

<script>
const SAMPLE=/*SAMPLE*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={E:{n:'出来事',k:'events',c:'--c-E'},M:{n:'心情',k:'feelings',c:'--c-M'},D:{n:'仕掛け',k:'devices',c:'--c-D'},Q:{n:'設問',k:'questions',c:'--c-Q'},P:{n:'人物',k:'people',c:'--c-P'}};
const DTYPES=['象徴（くり返される物）','比喩','情景描写','語りの仕掛け','対比','構成（くり返し・伏線）','結末','その他'];
const QTYPES=['心情説明','変化の理由','行動の理由','表現の効果','対比','内容説明','その他'];
const cv=id=>`style="--c:var(${KIND[id[0]].c})"`;

/* ---------- 保存 ---------- */
const store={mode:'wait',col:null,
  async init(){
    try{ if(window.claude?.use){ const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); const id=user?await user.id():null;
      if(db&&id){ this.col=db.collection('data/users/'+id); const snap=await this.col.get(); this.mode='cloud'; return snap.docs.map(d=>{ try{ return JSON.parse(JSON.stringify(d.data())); }catch(e){ return null; } }).filter(w=>w&&w.id&&Array.isArray(w.text)).map(fixWork); } } }catch(e){}
    this.mode='local'; try{return JSON.parse(localStorage.getItem('reading-works')||'[]').filter(w=>w&&Array.isArray(w.text)).map(fixWork)}catch(e){return []}
  },
  async save(w){ if(this.mode==='cloud') await this.col.doc(w.id).set(w); else this.saveLocal(); },
  async remove(id){ if(this.mode==='cloud') await this.col.doc(id).delete(); else this.saveLocal(); },
  saveLocal(){ try{localStorage.setItem('reading-works',JSON.stringify(works))}catch(e){ throw {message:'この端末に保存できなかった'} } }
};
let works=[],W=null,saveState='',timer=null,saving=false,dirtyW=null;
function touch(w){ w=w||W; if(dirtyW&&dirtyW!==w) flush(); w.updated=Date.now(); dirtyW=w; saveState='保存中…'; clearTimeout(timer); timer=setTimeout(flush,700); paintSave(); }
async function flush(){ if(saving||!dirtyW) return; saving=true; const w=JSON.parse(JSON.stringify(dirtyW)); dirtyW=null;
  try{ await store.save(w); saveState=store.mode==='cloud'?'保存済み':'この端末に保存済み'; }catch(e){ saveState='保存に失敗：'+(e.message||e.code||''); ui.msg={t:'保存に失敗した（'+(e.code||e.message||'')+'）。この文をそのまま教えてくれれば直せる。',at:'side'}; if(ui.view==='work') paintSide(); }
  saving=false; paintSave(); if(dirtyW) flush(); }
function paintSave(){ const el=$('save'); if(el) el.textContent=saveState; }

/* 読み込んだ作品の欠けた項目を補う */
function fixWork(w){ for(const k of ['people','scenes','events','feelings','devices','questions']) if(!Array.isArray(w[k])) w[k]=[];
  w.seq={E:0,M:0,D:0,Q:0,P:0,...(w.seq||{})};
  for(const t of ['E','M','D','Q','P']){ const mx=Math.max(0,...w[KIND[t].k].map(o=>+String(o.id).slice(1)||0)); if(w.seq[t]<mx) w.seq[t]=mx; }
  return w; }
/* ---------- 状態 ---------- */
const ui={view:'home',tab:'M',sel:null,edit:null,pending:null,msg:null,confirm:null,newForm:false,open:{}};
const all=()=>['events','feelings','devices','questions','people'].flatMap(k=>W[k]);
const get=id=>id&&KIND[id[0]]?W[KIND[id[0]].k].find(o=>o.id===id):undefined;
const nameOf=id=>{const o=get(id); if(!o) return '（削除済み）'; return o.label||o.what||o.name||o.q||''};
const firstPar=o=>o.ev&&o.ev.length?Math.min(...o.ev.map(e=>e.par)):9999;
const pos=o=>{ if(!o.ev||!o.ev.length) return 1e9; const e=o.ev[0]; return e.par*1e5+Math.max(0,W.text[e.par-1].indexOf(e.quote)); };
function newWork(title,author,raw){
  const text=raw.replace(/\r/g,'').split(/\n+/).map(s=>s.replace(/^[\s　]+|[\s　]+$/g,'')).filter(Boolean);
  return {id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,author,text,people:[],scenes:[],events:[],feelings:[],devices:[],questions:[],seq:{E:0,M:0,D:0,Q:0,P:0},updated:Date.now()};
}
function sampleWork(){ const s=SAMPLE,w=newWork(s.title+'（見本）',s.author,''); w.text=s.text; w.sample=true;
  w.people=s.people.map(p=>({id:p.id,name:p.name,calls:p.calls.join('、'),note:p.note}));
  w.scenes=s.scenes.map(x=>({from:x.from,name:x.name}));
  w.events=s.events.map(e=>({id:e.id,who:e.who,what:e.what,flash:!!e.flash,ev:[e.ev]}));
  w.feelings=s.feelings.map(m=>({id:m.id,who:m.who,label:m.label,toward:m.toward,kind:m.kind,cause:m.cause,action:m.action||'',ev:m.ev}));
  w.devices=s.devices.map(d=>({id:d.id,type:d.type,name:d.name,effect:d.effect,links:d.links,ev:d.ev}));
  w.questions=s.questions.map(q=>({id:q.id,type:q.type,q:q.q,limit:'',path:q.path,answer:q.answer,ev:[q.target]}));
  w.seq={E:w.events.length,M:w.feelings.length,D:w.devices.length,Q:w.questions.length,P:w.people.length}; return w; }

/* ---------- 点検 ---------- */
function inspect(){
  const out=[],add=(lv,id,msg)=>out.push({lv,id,msg});
  for(const o of all().filter(o=>o.ev)) for(const e of o.ev) if(!W.text[e.par-1]||!W.text[e.par-1].includes(e.quote)) add('a',o.id,`引用が本文（¶${e.par}）と一致しない。`);
  for(const m of W.feelings){
    const c=m.cause&&get(m.cause), a=m.action&&get(m.action);
    if(!c) add('a',m.id,'きっかけの出来事がつながっていない。この気持ちは何が起きて生まれた？');
    else if(firstPar(c)>firstPar(m)&&!c.flash) add('b',m.id,`きっかけ（¶${firstPar(c)}）が心情（¶${firstPar(m)}）より後に語られている。回想なら、出来事に回想の印をつける。`);
    if(a&&firstPar(a)<firstPar(m)) add('b',m.id,`行動（¶${firstPar(a)}）が心情（¶${firstPar(m)}）より前に語られている。順番を確かめる。`);
    if(!m.toward) add('c',m.id,'「何に対して」が空。対象を書くと、似た心情との違いがはっきりする。');
  }
  for(const d of W.devices){ if(!d.effect) add('a',d.id,'効果（解釈）が書かれていない。'); if(!d.links.filter(get).length) add('b',d.id,'どの心情とも重ねていない。この表現は誰のどんな気持ちと響き合う？'); }
  for(const q of W.questions){ const L=[...(q.answer||'')].length;
    if(!q.path.filter(get).length) add('a',q.id,'たどる順が空。どのモノを根拠に答えるかを決める。');
    if(!L) add('a',q.id,'解答がまだ書かれていない。');
    else if(q.limit&&L>+q.limit) add('a',q.id,`解答が${L}字。制限の${q.limit}字を超えている。`);
    else if(q.limit&&L<+q.limit*0.8) add('b',q.id,`解答が${L}字。制限${q.limit}字の8割（${Math.ceil(q.limit*0.8)}字）に届いていない。`);
  }
  const used=new Set(W.feelings.flatMap(m=>[m.cause,m.action]).concat(W.questions.flatMap(q=>q.path)));
  for(const e of W.events) if(!used.has(e.id)) add('c',e.id,'どの心情にもつながっていない出来事。');
  if(W.feelings.length>=3&&!W.feelings.some(m=>m.kind==='暗示')) add('c',null,'暗示の心情が0件。行動・表情・せりふ・情景から読み取れる気持ちを見落としていないか。');
  const cov=new Set(all().filter(o=>o.ev).flatMap(o=>o.ev.map(e=>e.par))),miss=W.text.map((_,i)=>i+1).filter(n=>!cov.has(n));
  if(miss.length&&cov.size) add('c',null,`根拠が1つもない段落：${miss.map(n=>'¶'+n).join(' ')}`);
  return out;
}

/* ---------- 描画：一覧 ---------- */
function vHome(){
  let h=`<header class="top"><h1>読解オントロジー工房</h1><span class="muted">小説を「出来事・心情・仕掛け」に分解して、入試問題を根拠つきで解く</span></header>`;
  if(store.mode==='wait') return h+`<div class="empty">保存してある作品を読み込んでいる…</div>`;
  h+=`<div class="panel dash"><ol class="steps"><li>小説の本文を貼り付けるか、本文の画像から文字起こしして、作品を作る</li><li>本文をなぞって選び、出来事・心情・仕掛けとして登録する（選んだ部分がそのまま根拠になる）</li><li>心情に「きっかけ」と「行動」の出来事をつなぐ</li><li>点検タブで抜けを確認し、設問をたどって解答を書く</li></ol></div>`;
  if(ui.msg) h+=`<div class="msg ${ui.msg.ok?'ok':''}" role="status">${esc(ui.msg.t)}</div>`;
  h+=`<div class="row"><h2>作品</h2><span class="grow"></span><span class="muted">${store.mode==='cloud'?'あなた専用の場所に保存される':'この端末のブラウザにだけ保存される'}</span></div>`;
  if(works.length) h+=`<div class="works">${works.slice().sort((a,b)=>b.updated-a.updated).map(w=>`<div class="work"><b>${esc(w.title)}</b><span class="muted">${esc(w.author||'')}　全${w.text.length}段落</span>

    <div class="row"><button class="btn pri" data-a="create">作品を作る</button><button class="btn" data-a="toggleNew">やめる</button></div></div>`;
  return h;
}

const HINT={M:'本文で気持ちが分かる箇所をなぞって選び、上のバーの「心情」を押す。',E:'「誰が何をした」が分かる箇所をなぞって選び、「出来事」を押す。並び順が「起きた順」になる。',D:'くり返し出てくる物、比喩、情景描写などをなぞって選び、「仕掛け」を押す。',Q:'設問の傍線部をなぞって選び、「設問」を押す。',P:'登場人物を登録しておくと、出来事や心情で選べる。'};

/* ---------- 本文の選択 ---------- */
document.addEventListener('selectionchange',()=>{
  if(ui.view!=='work') return; const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount) return;
  const up=n=>{ n=n&&(n.nodeType===1?n:n.parentElement); return n&&n.closest('.pt'); };
  const a=up(s.anchorNode),f=up(s.focusNode); if(!a&&!f) return;
  if(!a||!f||a!==f){ ui.pending={err:'選択が段落をまたいでいる。根拠は1つの段落の中から選ぶ（長い場合は2つに分けて追加する）。'}; paintSel(); return; }
  const q=s.toString().replace(/\s+/g,'').length?s.toString().trim():''; if(!q) return;
  const par=+a.dataset.n; if(!W.text[par-1].includes(q)) return;
  ui.pending={par,quote:q}; paintSel();
});

/* ---------- 画像から文字起こし ---------- */
const OCR_PROMPT=`この画像は、日本語の小説（入試問題などの本文）を写したものです。本文を一字一句そのまま文字に起こしてください。

守ること：
- 縦書きの場合は、右の行から左の行へ読む。段組みがあれば上の段から。
- 文字を直さない。旧字・送り仮名・句読点・かぎ括弧も、画像のとおりに写す。
- ルビ（ふりがな）は書かない。
- 行番号、注の番号や記号（＊、注1 など）、傍線や波線につけられた記号（ア、A、①、X など）は入れない。傍線が引かれた部分の文字そのものは、本文として残す。
- 空欄の記号（［　Ａ　］など）は、そのまま残す。
- 1つの段落を1行にする。画像の中の単なる行の折り返しでは改行しない。段落の頭の字下げ（全角スペース）は入れない。
- 設問文、前書き（リード文）、注釈、出典の表示は除き、小説の本文だけにする。
- どうしても読めない文字は「〓」1字に置きかえる。推測で埋めない。
- 説明や前置き、かぎ括弧やコードブロックでの囲みは付けず、本文だけを出力する。`;
const ocr={sample:null,lim:null,ready:false,imgs:[],busy:false,ctl:null,status:'',msg:null};
async function initOcr(){ try{ if(window.claude?.use){ const s=await claude.use('sample'); const l=s?await s.limits().catch(()=>null):null; if(s&&l&&l.images){ ocr.sample=s; ocr.lim=l.images; } } }catch(e){} ocr.ready=true; paintOcr(); }
function paintOcr(){ const el=$('ocr'); if(!el) return;
  if(!ocr.lim){ el.innerHTML=`<span class="muted">${ocr.ready?'画像からの文字起こしは、この画面では使えない。本文を下の欄に貼り付ける。':'画像の文字起こしが使えるか確認している…'}</span>`; return; }
  el.innerHTML=`<div class="row"><b style="font-size:14px">画像から文字起こし</b><span class="muted">本文を撮った写真やスクリーンショットを、読む順に追加する。ここに貼り付け（Ctrl+V）やドラッグでも追加できる。</span></div>
   ${ocr.imgs.length?`<ul class="imgs">${ocr.imgs.map((f,i)=>`<li><img src="${f.url}" alt=""><span>${esc(f.file.name||'貼り付けた画像')}（${Math.max(1,Math.round(f.file.size/1024))}KB）</span><button class="btn sm" data-a="ocrDel" data-i="${i}" ${ocr.busy?'disabled':''} aria-label="この画像を外す">×</button></li>`).join('')}</ul>`:''}
   <div class="row"><label class="btn ${ocr.busy?'':'pri'}" for="ocr-file" ${ocr.busy?'style="opacity:.45;pointer-events:none"':''}>画像を選ぶ</label><input type="file" id="ocr-file" accept="${esc(ocr.lim.mediaTypes.join(','))}" multiple hidden>
   ${ocr.busy?`<span role="status">${esc(ocr.status)}</span><button class="btn sm" data-a="ocrStop">止める</button>`:`<button class="btn" data-a="ocrRun" ${ocr.imgs.length?'':'disabled'}>文字起こしする（${ocr.imgs.length}枚）</button>`}</div>
   ${ocr.msg?`<div class="msg ${ocr.msg.ok?'ok':''}" role="status">${esc(ocr.msg.t)}</div>`:''}`;
}
function addImages(files){ if(!ocr.lim||ocr.busy) return; let bad=0;
  for(const f of files){ if(!ocr.lim.mediaTypes.includes(f.type)||f.size>ocr.lim.maxInputBytes){ bad++; continue; } ocr.imgs.push({file:f,url:URL.createObjectURL(f)}); }
  ocr.msg=bad?{t:`${bad}枚は追加できなかった（対応していない形式か、${Math.floor(ocr.lim.maxInputBytes/1048576)}MB を超えている）。`}:null; paintOcr(); }
async function runOcr(){ if(ocr.busy||!ocr.imgs.length) return; ocr.busy=true; ocr.msg=null; ocr.ctl=new AbortController(); const total=ocr.imgs.length; let done=0,err=null;
  while(ocr.imgs.length){ ocr.status=`${total}枚中 ${done+1}枚目を読み取っている…（1枚に1分ほどかかることがある）`; paintOcr();
    const ta=$('nw-text'); if(!ta){ err={code:'cancelled'}; break; } const base=ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n':'';
    const put=t=>{ const el=$('nw-text'); if(el){ el.value=base+t; el.scrollTop=el.scrollHeight; } };
    try{ const r=await ocr.sample(OCR_PROMPT,{images:[ocr.imgs[0].file],signal:ocr.ctl.signal,cache:false,onText:({text})=>put(text)}); put(r.text.trim()+'\n'); URL.revokeObjectURL(ocr.imgs.shift().url); done++; }
    catch(e){ err=e||{}; if(err.text) put(err.text); break; } }
  ocr.busy=false; ocr.ctl=null;
  const ta=$('nw-text'),miss=ta?(ta.value.match(/〓/g)||[]).length:0;
  if(err){ const m={cancelled:'止めた。',not_granted:'Claude の利用が許可されなかったので、文字起こしできない。本文を下の欄に貼り付ける。',rate_limited:'続けて使いすぎた。少し待ってからもう一度押す。',queue_overflow:'続けて使いすぎた。少し待ってからもう一度押す。',image_rejected:'この画像は受け付けられなかった。別の形式で保存し直すか、撮り直す。',images_unavailable:'この画面では画像を送れない。',refused:'この画像は文字起こしできなかった。',session_expired:'接続が切れた。ページを開き直してからもう一度試す。'}[err.code]||'文字起こしに失敗した。もう一度押して試す。';
    ocr.msg={t:`${m}${done?` ${done}枚目までは本文欄に入っている。`:''}${err.text?' 途中まで読めた分も残してある。':''}`}; }
  else ocr.msg={t:`${done}枚を文字起こしした。${miss?`読めなかった文字（〓）が${miss}か所ある。`:''}読み取りには誤りが混じることがある。原文と見比べて、誤字と段落の切れ目（ページの境目で段落が分かれていないか）を直してから作品を作る。`,ok:!miss};
  paintOcr(); }
document.addEventListener('paste',e=>{ if(ui.view!=='home'||!ui.newForm||!ocr.lim) return; const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')); if(fs.length){ e.preventDefault(); addImages(fs); } });
document.addEventListener('dragover',e=>{ const z=e.target.closest?.('#ocr'); if(z&&ocr.lim){ e.preventDefault(); z.classList.add('drag'); } });
document.addEventListener('dragleave',e=>{ e.target.closest?.('#ocr')?.classList.remove('drag'); });
document.addEventListener('drop',e=>{ const z=e.target.closest?.('#ocr'); if(!z||!ocr.lim) return; e.preventDefault(); z.classList.remove('drag'); addImages([...e.dataTransfer.files]); });

/* ---------- 操作 ---------- */
function blank(t){ return {E:{who:'',what:'',flash:false},M:{who:W.people[0]?.id||'',label:'',toward:'',kind:'明示',cause:'',action:''},D:{type:DTYPES[0],name:'',effect:'',links:[]},Q:{type:QTYPES[0],q:'',limit:'',path:[],answer:''},P:{name:'',calls:'',note:''}}[t]; }
function syncForm(){ if(!ui.edit) return; const d=ui.edit.d;
  document.querySelectorAll('#form [data-f]').forEach(el=>{ const k=el.dataset.f; if(el.type==='checkbox') d[k]=el.checked; else if(el.type==='radio'){ if(el.checked) d[k]=el.value; } else d[k]=el.value; });
  if('links' in d) d.links=[...document.querySelectorAll('#form [data-link]')].filter(el=>el.checked).map(el=>el.dataset.link); }
function saveForm(){
  syncForm();
  const e=ui.edit,d=e.d,t=e.kind,fail=m=>{ui.msg={t:m,at:'form'};paintSide();$('form')?.scrollIntoView({block:'nearest'});};
  if(t!=='P'&&!d.ev.length) return fail('登録できない：本文の根拠が1つもない。本文をなぞって選び、「根拠に追加」を押す。');
  const need={E:['what','何が起きたか'],M:['label','どんな心情か'],D:['name','名前'],Q:['q','設問文'],P:['name','名前']}[t];
  if(!String(d[need[0]]).trim()) return fail(`登録できない：「${need[1]}」が空。`);
  if(t==='M'&&!d.who) return fail(W.people.length?'登録できない：「誰の」心情かを選ぶ。':'登録できない：先に「人物」タブで人物を登録して、「誰の」心情かを選ぶ。');
  const label=String(d[need[0]]).trim().slice(0,20);
  if(e.id) Object.assign(get(e.id),d); else { const id=t+(++W.seq[t]); W[KIND[t].k].push({id,...d}); ui.sel=id; }
  ui.edit=null; ui.msg={t:`${KIND[t].n}「${label}」を${e.id?'更新':'登録'}した。`,ok:true,at:'side'}; ui.pending=null; getSelection()?.removeAllRanges(); touch(); render();
}
function remove(id){ const k=KIND[id[0]].k; W[k]=W[k].filter(o=>o.id!==id);
  for(const m of W.feelings){ if(m.cause===id)m.cause=''; if(m.action===id)m.action=''; if(m.who===id)m.who=''; }
  for(const ev of W.events) if(ev.who===id) ev.who='';
  for(const d of W.devices) d.links=d.links.filter(x=>x!==id);
  for(const q of W.questions) q.path=q.path.filter(x=>x!==id);
  if(ui.sel===id) ui.sel=null; ui.confirm=null; touch(); render(); }
async function exportWork(){ const data=JSON.stringify(W,null,1),name=(W.title||'reading').replace(/[\\/:*?"<>|]/g,'_')+'.json';
  try{ const dl=window.claude?.use?await claude.use('downloads'):null; if(dl){ await dl.save({filename:name,data}); ui.msg={t:'ファイルに書き出した。',ok:true,at:'side'}; } else { await navigator.clipboard.writeText(data); ui.msg={t:'この画面ではファイルに保存できないので、データをクリップボードにコピーした。メモ帳などに貼り付けて保存する。',ok:true,at:'side'}; } }
  catch(e){ ui.msg={t:e&&e.code==='declined'?'書き出しを取りやめた。':'書き出せなかった。',at:'side'}; } paintSide(); }
function showErr(x,where){ const m=`不具合が起きた（${where}）：${(x&&(x.message||x.code))||x}`; ui.msg={t:m+'。この文をそのまま教えてくれれば直せる。',at:ui.edit?'form':'side'}; try{ ui.view==='work'?paintSide():render(); }catch(_){ alert&&0; } }
window.addEventListener('error',e=>showErr(e.error||e.message,'画面'));
window.addEventListener('unhandledrejection',e=>showErr(e.reason,'保存など'));
document.addEventListener('click',e=>{ try{ onClick(e); }catch(x){ showErr(x,'ボタン「'+(e.target.closest('[data-a]')?.dataset.a||'')+'」'); } });
function onClick(e){
  const b=e.target.closest('[data-a]'); if(!b) return; const {a,id,t,i,n}=b.dataset;
  if(a==='toggleNew'){ ui.newForm=!ui.newForm; ui.msg=null; render(); }
  else if(a==='create'){ const title=$('nw-title').value.trim(),text=$('nw-text').value; const w=newWork(title||'無題',$('nw-author').value.trim(),text);
    if(ocr.busy){ ui.msg={t:'文字起こしの途中。終わるのを待つか、「止める」を押してから作る。'}; render(); return; }
    if(!w.text.length){ ui.msg={t:'本文が空。小説の本文を貼り付けるか、画像から文字起こしする。'}; render(); return; }
    for(const i of ['nw-title','nw-author','nw-text']) $(i).value=''; ocr.imgs=[]; ocr.msg=null;
    works.push(w); W=w; ui.view='work'; ui.tab='P'; ui.newForm=false; ui.msg={t:'作品を作った。まず「人物」を登録してから、本文をなぞって出来事や心情を登録していく。',ok:true,at:'side'}; ui.sel=ui.edit=ui.pending=null; touch(); render(); }
  else if(a==='addSample'){ const w=sampleWork(); works.push(w); touch(w); ui.msg={t:'見本「羅生門」を追加した。開いて中身を見たり、書き換えて試したりできる。',ok:true}; render(); }
  else if(a==='open'){ flush(); W=works.find(w=>w.id===id); ui.view='work'; ui.tab='M'; ui.sel=ui.edit=ui.pending=ui.msg=ui.confirm=null; saveState=''; render(); scrollTo(0,0); }
  else if(a==='home'){ clearTimeout(timer); flush(); ui.view='home'; ui.msg=null; ui.confirm=null; render(); }
  else if(a==='ask'){ ui.confirm=id; ui.view==='home'?render():paintSide(); }
  else if(a==='noConfirm'){ ui.confirm=null; ui.view==='home'?render():paintSide(); }
  else if(a==='delWork'){ works=works.filter(w=>w.id!==id); ui.confirm=null; store.remove(id).then(()=>{ui.msg={t:'作品を削除した。',ok:true};render();},()=>{ui.msg={t:'削除に失敗した。'};render();}); render(); }
  else if(a==='tab'){ ui.tab=t; if(ui.edit&&ui.edit.kind!==t) {} ui.msg=null; paintSide(); }
  else if(a==='new'){ if(!ui.pending||!ui.pending.quote) return; ui.edit={kind:t,id:null,d:{...blank(t),ev:[ui.pending]}}; ui.tab=t; ui.pending=null; ui.msg=null; getSelection()?.removeAllRanges(); paintSide(); paintSel(); $('form')?.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  else if(a==='newP'){ ui.edit={kind:'P',id:null,d:blank('P')}; ui.msg=null; paintSide(); $('f-name')?.focus(); }
  else if(a==='edit'){ const o=get(id); ui.edit={kind:id[0],id,d:JSON.parse(JSON.stringify(o))}; delete ui.edit.d.id; ui.tab=id[0]; ui.msg=null; paintSide(); paintSel(); $('form')?.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  else if(a==='cancel'){ ui.edit=null; ui.msg=null; paintSide(); paintSel(); }
  else if(a==='save'){ saveForm(); }
  else if(a==='del'){ remove(id); }
  else if(a==='evAdd'){ const p=ui.pending; if(!p||!p.quote||!ui.edit) return; if(!ui.edit.d.ev.some(x=>x.par===p.par&&x.quote===p.quote)) ui.edit.d.ev.push(p); ui.pending=null; ui.msg=null; getSelection()?.removeAllRanges(); ui.tab=ui.edit.kind; paintSide(); paintSel(); }
  else if(a==='evDel'){ ui.edit.d.ev.splice(+i,1); paintSide(); paintSel(); }
  else if(a==='pathAdd'){ const v=$('f-pathadd').value; if(v){ ui.edit.d.path.push(v); paintSide(); paintSel(); } }
  else if(a==='pathDel'){ ui.edit.d.path.splice(+i,1); paintSide(); paintSel(); }
  else if(a==='clearSel'){ ui.pending=null; getSelection()?.removeAllRanges(); paintSel(); }
  else if(a==='show'){ show(id,+i,false); }
  else if(a==='go'){ show(id,0,true); }
  else if(a==='openAns'){ ui.open[id]=true; paintSide(); }
  else if(a==='up'||a==='down'){ const k=W.events.findIndex(o=>o.id===id),j=k+(a==='up'?-1:1); [W.events[k],W.events[j]]=[W.events[j],W.events[k]]; touch(); paintSide(); }
  else if(a==='scene'){ const k=W.scenes.findIndex(s=>s.from===+n); if(k>=0) W.scenes.splice(k,1); else W.scenes.push({from:+n,name:'場面'+(W.scenes.length+1)}); touch(); paintText(); }
  else if(a==='export'){ exportWork(); }
  else if(a==='ocrRun'){ runOcr(); }
  else if(a==='ocrStop'){ ocr.ctl?.abort(); }
  else if(a==='ocrDel'){ URL.revokeObjectURL(ocr.imgs[+i].url); ocr.imgs.splice(+i,1); paintOcr(); }
}
function onField(e){ const el=e.target;
  if(el.dataset.scene){ const s=W.scenes.find(s=>s.from===+el.dataset.scene); if(s&&s.name!==el.value){ s.name=el.value; touch(); } return; }
  if(!ui.edit) return; const d=ui.edit.d;
  if(el.dataset.f){ const k=el.dataset.f; if(el.type==='checkbox') d[k]=el.checked; else if(el.type==='radio'){ if(el.checked) d[k]=el.value; } else d[k]=el.value;
    if(k==='answer'||k==='limit'){ const c=$('anscnt'),L=[...(d.answer||'')].length; if(c){ c.textContent=L+'字'+(d.limit?` ／ ${d.limit}字以内`:''); c.classList.toggle('over',!!d.limit&&L>+d.limit); } } }
  else if(el.dataset.link){ const id=el.dataset.link; d.links=d.links.filter(x=>x!==id); if(el.checked) d.links.push(id); }
}
document.addEventListener('input',onField); document.addEventListener('compositionend',onField); document.addEventListener('change',e=>{ onField(e);
  if(e.target.id==='ocr-file'){ addImages([...e.target.files]); return; }
  if(e.target.id==='imp'&&e.target.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const w=JSON.parse(r.result); if(!Array.isArray(w.text)||!w.text.length) throw 0;
      const n=newWork(w.title||'読み込んだ作品',w.author||'',''); for(const k of ['text','people','scenes','events','feelings','devices','questions']) if(Array.isArray(w[k])) n[k]=w[k]; if(w.seq) n.seq={...n.seq,...w.seq};
      works.push(n); touch(n); ui.msg={t:`「${n.title}」を読み込んだ。`,ok:true}; }catch(x){ ui.msg={t:'読み込めなかった。このツールで書き出した .json ファイルを選ぶ。'}; } render(); }; r.readAsText(e.target.files[0]); } });
window.addEventListener('pagehide',()=>{ if(dirtyW&&store.mode==='local'){ try{store.saveLocal()}catch(e){} } });

render();
store.init().then(list=>{ works=list; render(); });
initOcr();
</script>
