<title>オントロジー捜査線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 左に町の地図（群衆が歩く）、右に捜査パネル（事件／探索／詳細の3タブ）。狭い画面では縦に積む。 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e6ebe9; --ink:#17201d; --muted:#5a6863; --line:#cbd4d0; --line-strong:#8d9a95;
  --accent:#0f6b5c; --accent-soft:#d5ebe6; --mark:#b4560c; --bad:#b0372b; --bad-soft:#f6dedb; --good:#3d6a1c; --good-soft:#e1efd4;
  --pA:#0f9d8a; --pB:#e07b1a; --pC:#8d5bd6;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#0c110f; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2b3633; --line-strong:#5d6c67;
  --accent:#5fd0b8; --accent-soft:#16312b; --mark:#f0a560; --bad:#f08f82; --bad-soft:#3a1c18; --good:#9bd06a; --good-soft:#1e2e14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#0c110f; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2b3633; --line-strong:#5d6c67;
  --accent:#5fd0b8; --accent-soft:#16312b; --mark:#f0a560; --bad:#f08f82; --bad-soft:#3a1c18; --good:#9bd06a; --good-soft:#1e2e14; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.65;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:12px}
.cases{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line-strong);padding:5px 12px;cursor:pointer;border-radius:3px;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:700}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.x{border:0;background:none;color:var(--muted);padding:0 6px;font-size:16px;line-height:1}
.btn.x:hover{color:var(--bad)}
.miss{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.miss b{color:var(--bad)}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:940px){ .app{grid-template-columns:minmax(0,1fr) 410px} .mapcol{position:sticky;top:12px} }
.mapbox{border:1px solid var(--line-strong);background:var(--sunk);overflow-x:auto}
#map{display:block;width:100%;min-width:620px;aspect-ratio:1000/640;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.panel{background:var(--surface);border:1px solid var(--line);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 4px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:last-child{border-right:0}
.tab.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.body{padding:14px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-size:16px;margin:0;line-height:1.4}
h3{font-size:12px;margin:0;color:var(--muted);font-family:var(--f-mono);font-weight:500;letter-spacing:.06em}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.ty{font-family:var(--f-mono);font-size:11px;color:var(--mark)}
.say{border-left:3px solid var(--mark);padding:4px 10px;background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:1px 8px;cursor:pointer;font-size:13px;max-width:100%;text-align:left;overflow-wrap:anywhere}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted);font-family:var(--f-mono)}
.pipe{border:1px solid var(--line-strong);display:flex;flex-direction:column;min-width:0}
.pipe>div{padding:7px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pipe>div:last-child{border-bottom:0}
.pipe .hd{background:var(--sunk);font-weight:700}
.pipe .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.pipe .st{font-size:13px}
.pipe .st b{font-weight:700}
.pipe select,.pipe input{background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:2px 4px;min-width:0;max-width:100%}
.pipe input{width:92px}
.lab{font-size:12px;color:var(--muted);width:56px}
.over{background:var(--accent-soft);border:1px solid var(--accent);padding:8px 10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.who{display:flex;gap:12px;align-items:center}
.who canvas{background:var(--sunk);border:1px solid var(--line);flex:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.res{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.res.win{background:var(--good-soft)} .res.lose{background:var(--bad-soft)}
.res ul{margin:0;padding-left:18px}
.note{color:var(--muted);font-size:12px}
ol.how{margin:0;padding-left:20px;color:var(--muted);font-size:13px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>オントロジー捜査線</h1>
      <div class="sub">記録どうしのつながりをたどって、町の群衆から犯人ひとりを割り出す</div>
    </div>
    <div class="cases" id="cases"></div>
  </header>
  <div class="app">
    <div class="mapcol">
      <div class="mapbox"><canvas id="map" aria-label="町の地図。人物をクリックすると詳細が開く"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
'use strict';
/* ---------- 乱数・小道具 ---------- */
let rnd=Math.random;
const RNG=s=>{let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 町 ---------- */
const W=1000,H=640, COLX=[[20,230],[270,480],[520,730],[770,980]], ROWY=[[30,185],[240,400],[455,610]], ROADY=[212,428], ROADX=[250,500,750];
const PLACES=[
 {name:'北棟',kind:'住宅',c:0,r:0},
 {name:'宝石店ルミエール',kind:'店舗',c:1,r:0,job:'宝石店員',items:['指輪','ネックレス','腕時計']},
 {name:'みなと銀行',kind:'銀行',c:2,r:0,job:'銀行員'},
 {name:'中央駅',kind:'駅',c:3,r:0,job:'駅員'},
 {name:'ひだまり公園',kind:'公園',c:0,r:1,up:1,job:'清掃員'},
 {name:'酒場とまり木',kind:'店舗',c:1,r:1,job:'バーテンダー',items:['ビール','ウイスキー','つまみ']},
 {name:'金物店かなづち',kind:'店舗',c:2,r:1,up:1,job:'金物店員',items:['釘','ロープ','軍手','ペンキ']},
 {name:'東棟',kind:'住宅',c:3,r:1},
 {name:'食堂まんぷく',kind:'店舗',c:0,r:2,job:'調理師',items:['定食','カレー','うどん']},
 {name:'診療所',kind:'診療所',c:1,r:2,job:'看護師'},
 {name:'携帯ショップ',kind:'店舗',c:2,r:2,job:'販売員',items:['充電器','スマホケース','イヤホン']},
 {name:'南棟',kind:'住宅',c:3,r:2}];
PLACES.forEach(p=>{const[x0,x1]=COLX[p.c],[y0,y1]=ROWY[p.r];p.x0=x0;p.x1=x1;p.y0=y0;p.y1=y1;p.cx=(x0+x1)/2;
  const up=p.r===2||(p.r===1&&p.up);p.dy=up?y0:y1;p.ry=p.r===0?ROADY[0]:p.r===2?ROADY[1]:(p.up?ROADY[0]:ROADY[1])});
const HOMES=[0,7,11], WORKS=[1,2,3,4,5,6,8,9,10], PUBLIC=[1,2,3,4,5,6,8,9,10];
const HAIR={黒:'#1d1b1a',茶:'#6b4226',金:'#d9b45a',灰:'#9a9a9a',赤毛:'#a8452a'};
const COAT={赤:'#c0392b',青:'#2f6fb5',緑:'#3f8f4f',黄:'#d8b02f',黒:'#2b2d33',白:'#e9e7e0'};
const SKIN=['#f2d3b6','#e6bd98','#cf9f76','#a9764f','#7d543a'];
const BUILD={小柄:.86,中背:1,大柄:1.16};
const SEI='佐藤 鈴木 高橋 田中 渡辺 伊藤 山本 中村 小林 加藤 吉田 山田 松本 井上 木村 林 斎藤 清水 山崎 森 池田 橋本 阿部 石川 前田 藤田 小川 岡田 後藤 長谷川 村上 近藤 石井 坂本 遠藤 青木 藤井 西村 福田 太田'.split(' ');
const MEI='蓮 陽葵 湊 凛 樹 結衣 大和 咲 悠真 芽依 颯 楓 律 澪 朝陽 紬 奏 杏 新 琴音 岳 詩 匠 茜 航 葵 誠 遥 修 千尋 健 薫 実 晶 望 忍 光 純 歩 円'.split(' ');

/* ---------- オントロジーの型 ---------- */
const PROPS={人物:['氏名','年齢','職業','髪色','上着','体格'],場所:['名称','種別'],車両:['ナンバー','車種','色'],電話:['番号','契約'],
  通話:['時刻'],滞在記録:['入','出'],取引:['時刻','品目','金額','支払'],事件:['名称','時刻'],証言:['内容']};
const LINKS=[['人物','住居','場所','住人'],['人物','勤務先','場所','従業員'],['人物','所有車両','車両','所有者'],['人物','契約電話','電話','契約者'],
  ['滞在記録','人物','人物','滞在記録'],['滞在記録','場所','場所','滞在記録'],['取引','店舗','場所','取引'],['取引','支払者','人物','取引'],
  ['取引','購入品','電話','購入取引'],['通話','発信元','電話','発信通話'],['通話','着信先','電話','着信通話'],['事件','現場','場所','事件'],['証言','事件','事件','証言']];
const TYPES=Object.keys(PROPS), SCH={};
TYPES.forEach(t=>SCH[t]={props:PROPS[t],links:{}});
LINKS.forEach(([a,la,b,lb])=>{SCH[a].links[la]=b;SCH[b].links[lb]=a});

/* ---------- 事件の生成 ---------- */
function build(kind,seed){
  rnd=RNG(seed);
  const db={o:{},t:{}};TYPES.forEach(t=>db.t[t]=[]);
  const add=(type,p)=>{const o={id:type[0]+type.charCodeAt(1)+'_'+db.t[type].length,type,p,l:{}};db.o[o.id]=o;db.t[type].push(o);return o};
  const link=(a,la,b)=>{const L=LINKS.find(x=>x[0]===a.type&&x[1]===la);(a.l[la]=a.l[la]||[]).push(b.id);(b.l[L[3]]=b.l[L[3]]||[]).push(a.id)};
  const pl=PLACES.map(p=>add('場所',{名称:p.name,種別:p.kind}));
  const sei=shuffle(SEI),mei=shuffle(MEI),N=36,ppl=[],phoneOf=[];
  const num=()=>'090-'+ri(1000,9999)+'-'+ri(1000,9999);
  for(let i=0;i<N;i++){
    const w=WORKS[i%WORKS.length],h=pick(HOMES);
    const o=add('人物',{氏名:sei[i]+' '+mei[i],年齢:ri(19,68),職業:PLACES[w].job,髪色:pick(Object.keys(HAIR)),上着:pick(Object.keys(COAT)),体格:pick(Object.keys(BUILD))});
    o.home=h;o.work=w;o.skin=pick(SKIN);link(o,'住居',pl[h]);link(o,'勤務先',pl[w]);
    const ph=add('電話',{番号:num(),契約:'通常'});link(o,'契約電話',ph);phoneOf.push(ph);ppl.push(o);
  }
  const VT=['軽自動車','セダン','バン','バイク'],VC=['白','黒','赤','青','銀'],cars=[];
  const plate=()=>pick(['み','な','と','は','ま'])+' '+ri(10,99)+'-'+ri(10,99);
  ppl.forEach((o,i)=>{if(rnd()<.6||i===0){const v=add('車両',{ナンバー:plate(),車種:pick(VT),色:pick(VC)});link(o,'所有車両',v);cars.push([o,v])}});
  const ci=ri(1,N-1), cul=ppl[ci], T=kind===1?ri(780,960):kind===2?ri(840,900):ri(1140,1230), t2=ri(600,690);
  if(kind===2&&!cul.l.所有車両){const v=add('車両',{ナンバー:plate(),車種:pick(VT),色:pick(VC)});link(cul,'所有車両',v);cars.push([cul,v])}
  const forced=kind===1?[[1,T]]:kind===2?[[6,t2]]:[[10,t2],[3,T]];
  /* 一日の滞在記録 */
  const stays=[];
  ppl.forEach(o=>{
    let segs=[];const wS=480+ri(0,90),wE=1020+ri(0,90);
    segs.push([o.home,390+ri(0,50),wS-10]);
    if(rnd()<.6){const l=720+ri(0,60),d=ri(30,50);segs.push([o.work,wS,l-5],[pick([8,4,5]),l,l+d],[o.work,l+d+5,wE])}else segs.push([o.work,wS,wE]);
    let e=wE+10;
    if(rnd()<.65){const d=ri(30,100);segs.push([pick(PUBLIC),e,e+d]);e+=d+10}
    segs.push([o.home,e,1410]);
    if(o===cul)for(const[fp,ft]of forced){const a=ft-ri(6,15),b=ft+ri(6,15),out=[];
      for(const s of segs){if(s[2]<=a||s[1]>=b){out.push(s);continue}
        if(a-5-s[1]>=10)out.push([s[0],s[1],a-5]);if(s[2]-b-5>=10)out.push([s[0],b+5,s[2]])}
      out.push([fp,a,b]);segs=out.sort((x,y)=>x[1]-y[1])}
    o.segs=segs;
    segs.forEach(s=>{const st=add('滞在記録',{入:hm(s[1]),出:hm(s[2])});st.a=s[1];st.b=s[2];st.pi=s[0];link(st,'人物',o);link(st,'場所',pl[s[0]]);stays.push([o,st])});
  });
  /* 買い物と通話 */
  const price={指輪:48000,ネックレス:32000,腕時計:26000,ビール:600,ウイスキー:900,つまみ:450,釘:300,ロープ:800,軍手:250,ペンキ:1400,定食:850,カレー:700,うどん:550,充電器:1800,スマホケース:1200,イヤホン:3200};
  const tx=(pi,t,item,amt,payer)=>{const x=add('取引',{時刻:hm(t),品目:item,金額:amt,支払:payer?'カード':'現金'});link(x,'店舗',pl[pi]);if(payer)link(x,'支払者',payer);return x};
  ppl.forEach(o=>{const c=o.segs.filter(s=>PLACES[s[0]].items&&s[0]!==o.work);
    shuffle(c).slice(0,2).forEach(s=>{const it=pick(PLACES[s[0]].items);tx(s[0],ri(s[1]+1,s[2]-1),it,price[it],rnd()<.7?o:null)})});
  const call=(a,b,t)=>{const c=add('通話',{時刻:hm(t)});link(c,'発信元',a);link(c,'着信先',b);return c};
  ppl.forEach((o,i)=>{for(let k=ri(2,3);k--;){let j=ri(0,N-1);if(j!==i)call(phoneOf[i],phoneOf[j],ri(420,1380))}});
  /* 事件ごとの仕込み */
  const stayAt=(pi,t)=>[...new Set(stays.filter(([,s])=>s.pi===pi&&s.a<=t&&s.b>=t).map(([o])=>o))];
  const say=(inc,txt)=>link(add('証言',{内容:txt}),'事件',inc);
  let inc,sets;
  if(kind===1){
    inc=add('事件',{名称:'宝石店ルミエール 指輪窃盗',時刻:hm(T)});link(inc,'現場',pl[1]);
    say(inc,'犯行時刻、犯人は客のふりをして店内にいた。滞在記録が残っているはずだ。');
    say(inc,`犯人は${cul.p.上着}の上着を着ていた。`);say(inc,`髪は${cul.p.髪色}だった。`);
    sets=[['犯行時刻に宝石店にいた',stayAt(1,T)],[`上着が${cul.p.上着}`,ppl.filter(o=>o.p.上着===cul.p.上着)],[`髪色が${cul.p.髪色}`,ppl.filter(o=>o.p.髪色===cul.p.髪色)]];
  }else if(kind===2){
    const v=db.o[cul.l.所有車両[0]];
    shuffle(cars.filter(c=>c[0]!==cul)).slice(0,2).forEach(c=>{c[1].p.車種=v.p.車種;c[1].p.色=v.p.色});
    tx(6,t2,'バール',2400,null);
    inc=add('事件',{名称:'みなと銀行 強盗',時刻:hm(T)});link(inc,'現場',pl[2]);
    say(inc,'犯人は覆面で裏口から押し入った。銀行の滞在記録には残っていない。');
    say(inc,`犯人は${v.p.色}の${v.p.車種}で逃走した。`);say(inc,`体格は${cul.p.体格}だった。`);
    say(inc,'現場に新品のバールが落ちていた。当日どこかの店で、現金で買われたものらしい。買った時刻に店にいた人物を洗え。');
    sets=[[`${v.p.色}の${v.p.車種}の所有者`,cars.filter(c=>c[1].p.車種===v.p.車種&&c[1].p.色===v.p.色).map(c=>c[0])],
      [`体格が${cul.p.体格}`,ppl.filter(o=>o.p.体格===cul.p.体格)],['バール購入時刻に金物店にいた',stayAt(6,t2)]];
  }else{
    const burner=add('電話',{番号:num(),契約:'プリペイド'});link(tx(10,t2,'プリペイド携帯',5800,null),'購入品',burner);
    shuffle(ppl.filter(o=>o!==cul)).slice(0,2).forEach(o=>{const b=add('電話',{番号:num(),契約:'プリペイド'});link(tx(10,ri(620,1000),'プリペイド携帯',5800,o),'購入品',b)});
    const clinic=add('電話',{番号:'03-'+ri(1000,9999)+'-'+ri(1000,9999),契約:'法人'});
    const others=shuffle(ppl.map((o,i)=>i).filter(i=>i!==ci)),q=others[0];
    call(burner,phoneOf[q],T-ri(60,120));call(burner,clinic,T);call(phoneOf[ci],phoneOf[q],ri(500,700));
    others.slice(1,4).forEach(i=>call(phoneOf[i],phoneOf[q],ri(420,1300)));
    inc=add('事件',{名称:'診療所 脅迫電話',時刻:hm(T)});link(inc,'現場',pl[9]);
    say(inc,`脅迫電話の発信番号は ${burner.p.番号}。プリペイド契約で、契約者の登録はない。`);
    say(inc,'その電話機は現金で買われている。購入の取引時刻に、店にいた人物を洗え。');
    say(inc,'受話器の向こうで発車ベルが鳴っていた。犯人は通話の時刻、中央駅にいた。');
    say(inc,'同じ番号は事件前にもう1件発信している。受けた相手は犯人の知人で、犯人は自分名義の電話からもその相手にかけているはずだ。');
    const callers=[...new Set((phoneOf[q].l.着信通話||[]).map(id=>db.o[db.o[id].l.発信元[0]]).flatMap(p=>(p.l.契約者||[]).map(id=>db.o[id])))];
    sets=[['プリペイド携帯の購入時刻に携帯ショップにいた',stayAt(10,t2)],['犯人の知人に電話をかけていた',callers],['脅迫電話の時刻に中央駅にいた',stayAt(3,T)]];
  }
  const inter=ppl.filter(o=>sets.every(s=>s[1].includes(o)));
  const ok=inter.length===1&&inter[0]===cul&&sets.every(s=>s[1].length>=2);
  return{db,cul,inc,sets,ok,ppl};
}

const PC=['#0f9d8a','#e07b1a','#8d5bd6'], PN=['A','B','C'];
let S, baseSeed=(Date.now()%1e6)|0, pawns=[];
function start(kind){
  let seed=baseSeed*10+kind,w;
  for(let i=0;i<400;i++){w=build(kind,seed+i*7919);if(w.ok)break}
  rnd=Math.random;
  S={kind,...w,tab:'case',pipes:[{type:'人物',steps:[],d:{}}],sel:null,hist:[],marks:new Set(),miss:0,done:null,confirm:false};
  pawns=w.ppl.map(o=>{const p=PLACES[rnd()<.5?o.home:o.work];return{o,at:p,x:p.x0+20+rnd()*(p.x1-p.x0-40),y:p.y0+24+rnd()*(p.y1-p.y0-44),path:[],wait:rnd()*4,trip:5+rnd()*25,dir:'d',ph:rnd()*6,mv:false}});
  render();
}

/* ---------- 探索（クエリ） ---------- */
function test(v,op,q){
  if(v==null)return false;
  const n=typeof v==='number'&&q!==''&&!isNaN(q);const a=n?v:String(v),b=n?+q:String(q);
  return op==='='?a===b:op==='≠'?a!==b:op==='≤'?a<=b:op==='≥'?a>=b:String(v).includes(q);
}
function run(pipe){
  let type=pipe.type,set=S.db.t[type].slice();const stages=[set.length];
  for(const s of pipe.steps){
    if(s.k==='f')set=set.filter(o=>test(o.p[s.prop],s.op,s.val));
    else{const seen=new Set(),out=[];for(const o of set)for(const id of(o.l[s.label]||[]))if(!seen.has(id)){seen.add(id);out.push(S.db.o[id])}set=out;type=SCH[type].links[s.label]}
    stages.push(set.length)}
  return{type,set,stages};
}
function ttl(o){const p=o.p,d=S.db.o,one=l=>o.l[l]&&d[o.l[l][0]];
  switch(o.type){case'人物':return p.氏名;case'場所':return p.名称;case'車両':return`${p.色}の${p.車種}（${p.ナンバー}）`;case'電話':return p.番号;
    case'通話':return`${p.時刻} の通話`;case'滞在記録':return`${one('場所').p.名称} ${p.入}–${p.出}`;case'取引':return`${p.時刻} ${p.品目}`;case'事件':return p.名称;default:return p.内容}}
let HL=[],ALL=new Set();
function refreshHL(){
  HL=S.pipes.map(p=>{const r=run(p);return r.type==='人物'&&p.steps.length?new Set(r.set.map(o=>o.id)):null});
  const act=HL.filter(Boolean);ALL=new Set(act.length?S.ppl.filter(o=>act.every(s=>s.has(o.id))).map(o=>o.id):[]);
}

  });
}
const inside=p=>[p.x0+16+Math.random()*(p.x1-p.x0-32),p.y0+26+Math.random()*(p.y1-p.y0-46)];
function route(a,b){
  const r=[[a.cx,a.dy],[a.cx,a.ry]];
  if(a.ry!==b.ry){const m=(a.cx+b.cx)/2,vx=ROADX.reduce((u,v)=>Math.abs(v-m)<Math.abs(u-m)?v:u);r.push([vx,a.ry],[vx,b.ry])}
  r.push([b.cx,b.ry],[b.cx,b.dy],inside(b));return r;
}
function step(dt){
  for(const p of pawns){
    if(p.path.length){const[tx,ty]=p.path[0],dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),v=44*dt;
      if(d<=v){p.x=tx;p.y=ty;p.path.shift()}else{p.x+=dx/d*v;p.y+=dy/d*v;p.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u')}
      p.ph+=dt*11;p.mv=true;continue}
    p.mv=false;p.trip-=dt;p.wait-=dt;
    if(p.trip<=0){const u=Math.random(),to=PLACES[u<.25?p.o.home:u<.55?p.o.work:PUBLIC[Math.floor(Math.random()*PUBLIC.length)]];
      p.trip=14+Math.random()*30;if(to!==p.at){p.path=route(p.at,to);p.at=to}}
    else if(p.wait<=0){p.wait=2+Math.random()*5;p.path=[inside(p.at)]}
  }
}
function frame(){
  const c=cx;c.setTransform(K,0,0,K,0,0);drawTown(c);
  const any=HL.some(Boolean),multi=HL.filter(Boolean).length>1;
  for(const p of pawns.slice().sort((a,b)=>a.y-b.y)){
    const id=p.o.id,hit=HL.map(s=>s&&s.has(id)),on=hit.some(Boolean),sel=id===S.sel,gone=S.done&&id===S.cul.id;
    c.globalAlpha=any&&!on&&!sel&&!gone?.3:1;
    let r=14;hit.forEach((h,i)=>{if(h){c.strokeStyle=PC[i];c.lineWidth=3;c.beginPath();c.ellipse(p.x,p.y+7,r,r*.5,0,0,7);c.stroke();r+=4.5}});
    drawPawn(c,p.x,p.y,p.o,p.dir,p.ph,p.mv);
    c.globalAlpha=1;c.textAlign='center';c.textBaseline='alphabetic';
    let top=p.y-26*BUILD[p.o.p.体格];
    if(multi&&ALL.has(id)){c.fillStyle='#fff';c.strokeStyle='#1b1a19';c.lineWidth=1.5;c.beginPath();c.moveTo(p.x,top-12);c.lineTo(p.x+6,top-6);c.lineTo(p.x,top);c.lineTo(p.x-6,top-6);c.closePath();c.fill();c.stroke();top-=14}
    if(S.marks.has(id)){c.font='900 15px sans-serif';c.lineWidth=3;c.strokeStyle='#fff';c.strokeText('？',p.x,top);c.fillStyle='#c8362a';c.fillText('？',p.x,top);top-=15}
    if(sel||p===hover||gone){const t=gone?'逮捕：'+p.o.p.氏名:p.o.p.氏名;c.font='700 12px "IBM Plex Sans JP",sans-serif';const w=c.measureText(t).width+10;
      c.fillStyle=gone?'#c8362a':sel?'#17201d':'rgba(23,32,29,.8)';c.fillRect(p.x-w/2,top-16,w,18);c.fillStyle='#fff';c.fillText(t,p.x,top-3)}
    c.textAlign='left';
  }
}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(S){step(dt);frame()}requestAnimationFrame(loop)}
function pawnAt(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;let best=null,bd=20;
  for(const p of pawns){const d=Math.hypot(p.x-x,p.y-5-y);if(d<bd){bd=d;best=p}}return best}
cv.addEventListener('mousemove',e=>{hover=pawnAt(e)});
cv.addEventListener('mouseleave',()=>{hover=null});
cv.addEventListener('click',e=>{const p=pawnAt(e);if(p)open(p.o.id,false)});

start(1);requestAnimationFrame(loop);
</script>
