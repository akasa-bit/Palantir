<title>オントロジー工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 左に作業台 (生データ→定義フォーム)、右に育っていくオントロジー図。図が常に主役として見える2カラム、狭い画面では図を上に積む。 */
:root{
  --bg:#e9edf2; --surface:#f8fafc; --sunk:#dfe5ec; --ink:#14202e; --muted:#566475; --line:#c3ccd7; --line-strong:#8492a3;
  --accent:#1d4fb8; --accent-ink:#ffffff; --key:#a35a00;
  --ok:#17764a; --bad:#b3261e; --warn:#8a5a00;
  --o-ac:#1d4fb8; --o-fl:#0a7f86; --o-ap:#7a3fa8; --o-al:#c2410c;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202a; --sunk:#0b1016; --ink:#e4eaf1; --muted:#97a4b4; --line:#2c3846; --line-strong:#5b6b7e;
  --accent:#7ea6ff; --accent-ink:#0b1422; --key:#f0b35a;
  --ok:#5fd09a; --bad:#ff8a80; --warn:#f0b35a;
  --o-ac:#7ea6ff; --o-fl:#4fd0d6; --o-ap:#c79bf0; --o-al:#ff9a66; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --sunk:#0b1016; --ink:#e4eaf1; --muted:#97a4b4; --line:#2c3846; --line-strong:#5b6b7e;
  --accent:#7ea6ff; --accent-ink:#0b1422; --key:#f0b35a;
  --ok:#5fd09a; --bad:#ff8a80; --warn:#f0b35a;
  --o-ac:#7ea6ff; --o-fl:#4fd0d6; --o-ap:#c79bf0; --o-al:#ff9a66; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.steps li::before{content:counter(s) " ";font-family:var(--f-mono)}
.steps li.now{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.steps li.done{color:var(--ok);border-color:var(--ok)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){ .app{grid-template-columns:minmax(0,1fr)} aside{position:static;order:-1} .graph{max-width:440px} }

.graph{border:1px solid var(--line);background-color:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px}
.graph svg{display:block;width:100%;height:auto}
.graph-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.n-box{fill:var(--surface);stroke-width:2}
.n-box.raw{stroke:var(--line-strong);stroke-dasharray:5 4;stroke-width:1.5}
.n-name{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ink)}
.n-sub{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.l-line{stroke:var(--line-strong);stroke-width:1.6;fill:none}
.l-head{fill:var(--line-strong)}
.l-lab{font-size:11px;fill:var(--ink);font-family:var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.a-pill{fill:var(--ink)} .a-txt{fill:var(--bg);font-size:10px;font-family:var(--f-body);font-weight:700}

h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0;max-width:65ch}
.lead{display:flex;flex-direction:column;gap:8px}
.term{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.panel{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flat{background:none;border-style:dashed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:13px;font-weight:700;min-width:5.5em}
.mono{font-family:var(--f-mono);font-size:13px}
.tscroll{overflow-x:auto;border:1px solid var(--line);background:var(--sunk)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}

button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.obj{font-family:var(--f-body);font-weight:700;border-width:2px;border-color:var(--c)}
.chip.obj.on{background:var(--c);color:var(--surface)}
.btn{padding:8px 18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:4px}
.btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input[type=number]{padding:6px 8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;max-width:100%}
.msg{font-size:14px;padding:8px 12px;border-left:3px solid var(--bad);background:var(--sunk)}
.msg.ok{border-color:var(--ok)}
.msg b{font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid currentColor;line-height:1.6}
.tag.ok{color:var(--ok)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)}
.done-line{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px}
.done-line .mono{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px}
.pk{color:var(--key);font-family:var(--f-mono);font-size:12px;font-weight:500}
.grow{flex:1}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.checks .bx{font-family:var(--f-mono);font-size:12px;width:3.2em;flex:none;color:var(--muted)}
.checks li.y .bx{color:var(--ok);font-weight:500}
.checks li.y{color:var(--muted)}
.alarm{border:2px solid var(--bad);padding:10px 14px;background:var(--surface)}
.alarm b{color:var(--bad)}
.exp{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px}
@media (max-width:640px){ .exp{grid-template-columns:minmax(0,1fr)} }
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--c);border-radius:0;width:100%}
.item.on{background:var(--sunk);border-color:var(--c)}
.item small{color:var(--muted);font-size:12px}
.detail{display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.big{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1.1}
ul.plain{margin:0;padding-left:1.2em;max-width:65ch}
@media (prefers-reduced-motion:no-preference){ .pop{animation:pop .35s ease-out} @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}} }
</style>

<div class="wrap">
  <header class="top">
    <h1>オントロジー工房</h1>
    <span class="sub">ツバメ航空（架空）運航管理室 ／ バラバラの表を、現場が使える「世界のモデル」に組み上げる</span>
  </header>
  <ol class="steps" id="steps"></ol>
  <div class="app">
    <main id="main"></main>
    <aside>
      <div class="graph" id="graph"></div>
      <div class="graph-cap"><span>ONTOLOGY</span><span id="gcount"></span></div>
    </aside>
  </div>
</div>

<script>
const DS={
  aircraft:{ds:'ac_master',name:'航空機',c:'--o-ac',pk:'tail_no',title:['tail_no'],
    cols:['tail_no','model','seats','base_apt','status'],
    props:{tail_no:'機体番号',model:'機種',seats:'座席数',base_apt:'拠点空港',status:'状態'},
    rows:[['JA812T','A320neo',180,'HND','運航可能'],['JA305K','B737-800',165,'HND','運航可能'],['JA771M','A321',210,'HND','運航可能'],
          ['JA118R','B787-8',290,'ITM','運航可能'],['JA460S','A320neo',180,'HND','整備中'],['JA552N','E190',95,'HND','運航可能']],
    pkHint:{}, titleHint:{model:'A320neo が2機ある。一覧に並んだとき見分けがつかない。'}},
  flight:{ds:'flt_sched',name:'フライト',c:'--o-fl',pk:'flt_id',title:['flt_no'],
    cols:['flt_id','flt_no','tail_no','dep_apt','arr_apt','dep_time','pax'],
    props:{flt_id:'フライトID',flt_no:'便名',tail_no:'使用機材',dep_apt:'出発',arr_apt:'到着',dep_time:'出発時刻',pax:'乗客数'},
    rows:[['F1001','TB101','JA812T','HND','CTS','08:10',172],['F1002','TB102','JA812T','CTS','HND','11:30',158],['F1003','TB215','JA812T','HND','FUK','15:20',177],
          ['F1004','TB330','JA305K','HND','ITM','09:00',150],['F1005','TB411','JA118R','ITM','OKA','10:15',260],['F1006','TB520','JA771M','HND','OKA','13:40',198],['F1007','TB088','JA552N','HND','CTS','07:30',88]],
    pkHint:{flt_no:'この表では重複していないけど、便名は毎日同じ番号で飛ぶ。日をまたぐと重複するので主キーには向かない。',
            dep_time:'出発時刻はたまたま重複していないだけ。同じ時刻に2便出れば壊れる。',pax:'乗客数はたまたま重複していないだけ。'},
    titleHint:{flt_id:'F1001 はシステムの連番。現場の人が呼ぶ名前は別の列にある。'}},
  airport:{ds:'apt_ref',name:'空港',c:'--o-ap',pk:'iata',title:['name','iata'],
    cols:['iata','name','city'],props:{iata:'空港コード',name:'空港名',city:'都市'},
    rows:[['HND','羽田空港','東京'],['ITM','伊丹空港','大阪'],['CTS','新千歳空港','札幌'],['FUK','福岡空港','福岡'],['OKA','那覇空港','那覇']],
    pkHint:{name:'空港名は改称されることがある。他の表が参照しているのも名前ではなくコードのほう。',city:'1つの都市に空港が2つあることもある（東京なら羽田と成田）。'},
    titleHint:{city:'都市名だと、同じ都市の別の空港と区別できない。'}},
  alert:{ds:'mx_alerts',name:'整備アラート',c:'--o-al',pk:'alert_id',title:['summary'],
    cols:['alert_id','tail_no','summary','severity'],props:{alert_id:'アラートID',tail_no:'対象機',summary:'内容',severity:'重大度'},
    rows:[['A-501','JA812T','第2エンジン振動値が上限超過','重大'],['A-502','JA305K','客室読書灯の不点灯','軽微'],['A-503','JA118R','主脚タイヤ摩耗 交換時期接近','注意']],
    pkHint:{tail_no:'同じ機体に2件目のアラートが出た瞬間に重複する。',summary:'同じ内容の不具合は再発しうる。文章は主キーにしない。'},
    titleHint:{alert_id:'A-501 と表示されても、何が起きたのか分からない。',tail_no:'機体番号だけだと、何のアラートか分からない。',severity:'「重大」だけでは、どのアラートか区別できない。'}}
};
const ORDER=['aircraft','flight','airport','alert'];
const LINKS=[
  {id:'fl_ac',from:'flight',col:'tail_no',to:'aircraft',label:'使用機材',rev:'担当フライト',d:'M180 60 L229 60',lx:205,ly:50,an:'middle'},
  {id:'fl_dep',from:'flight',col:'dep_apt',to:'airport',label:'出発地',rev:'出発便',d:'M90 85 Q62 147 88 204',lx:70,ly:150,an:'end'},
  {id:'fl_arr',from:'flight',col:'arr_apt',to:'airport',label:'到着地',rev:'到着便',d:'M140 85 Q168 147 142 204',lx:160,ly:150,an:'start'},
  {id:'al_ac',from:'alert',col:'tail_no',to:'aircraft',label:'対象機',rev:'整備アラート',d:'M300 210 L300 91',lx:308,ly:154,an:'start'},
  {id:'ac_base',from:'aircraft',col:'base_apt',to:'airport',label:'拠点',rev:'所属機',d:'M245 85 L178 206',lx:232,ly:120,an:'start'}
];
const POS={flight:[115,60],aircraft:[300,60],airport:[115,235],alert:[300,235]};
const STEPS=['オブジェクト型','リンク型','アクション型','運用','結果'];
const RULES={status:'代替機の状態が「運航可能」である',seats:'代替機の座席数 ≥ フライトの乗客数',model:'代替機の機種が元の機材と同じ',exec:'実行者の役職が部長以上である'};

function fresh(){return {stage:0,miss:0,rejected:0,msg:null,
  obj:Object.fromEntries(ORDER.map(k=>[k,{pk:null,title:null,done:false}])),
  links:[],ls:[],lc:{},card:null,
  act:{ground:{obj:'',prop:'',val:'',done:false},swap:{obj:'',prop:'',val:'',rules:[],done:false}},
  ops:{tab:'alert',sel:null,t1:false,t2:false,t3:false,pax:'',picking:false},
  data:Object.fromEntries(ORDER.map(k=>[k,DS[k].rows.map(r=>Object.fromEntries(DS[k].cols.map((c,i)=>[c,r[i]])))]))};}
let S=fresh();
const $=id=>document.getElementById(id);
const col=k=>`style="--c:var(${DS[k].c})"`;
const say=(t,ok)=>{S.msg={t,ok:!!ok}};
const miss=t=>{S.miss++;say(t)};
const msgHtml=()=>S.msg?`<div class="msg ${S.msg.ok?'ok':''}" role="status">${S.msg.t}</div>`:'';
const find=(k,id)=>S.data[k].find(r=>r[DS[k].pk]===id);
const titleOf=(k,r)=>k==='flight'?`${r.flt_no} ${r.dep_apt}→${r.arr_apt}`:k==='airport'?r.name:k==='alert'?r.summary:r.tail_no;

/* ---------- 図 ---------- */
function drawGraph(){
  let s=`<svg viewBox="0 0 400 290" role="img" aria-label="作成中のオントロジー図"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="l-head" d="M0 0L10 5L0 10z"/></marker></defs>`;
  for(const L of LINKS) if(S.links.includes(L.id))
    s+=`<path class="l-line" d="${L.d}" marker-end="url(#ah)"/><text class="l-lab" x="${L.lx}" y="${L.ly}" text-anchor="${L.an}">${L.label}</text>`;
  for(const k of ORDER){const [x,y]=POS[k],d=DS[k],o=S.obj[k],on=S.stage===3&&S.ops.sel&&S.ops.sel.k===k;
    s+=`<rect class="n-box ${o.done?'':'raw'}" x="${x-65}" y="${y-25}" width="130" height="50" rx="3" ${o.done?`style="stroke:var(${d.c});stroke-width:${on?4:2}"`:''}/>`
      +`<text class="n-name" x="${x}" y="${y-2}" text-anchor="middle" ${o.done?'':'style="fill:var(--muted)"'}>${o.done?d.name:'？'}</text>`
      +`<text class="n-sub" x="${x}" y="${y+14}" text-anchor="middle">${o.done?'PK '+d.pk:d.ds}</text>`;}
  const pill=(k,t,w)=>{const [x,y]=POS[k];return `<rect class="a-pill" x="${x+65-w}" y="${y-43}" width="${w}" height="16" rx="8"/><text class="a-txt" x="${x+65-w/2}" y="${y-31.5}" text-anchor="middle">${t}</text>`};
  if(S.act.ground.done) s+=pill('aircraft','▸ 整備入りにする',104);
  if(S.act.swap.done) s+=pill('flight','▸ 機材を変更する',104);
  $('graph').innerHTML=s+'</svg>';
  const no=ORDER.filter(k=>S.obj[k].done).length, na=+S.act.ground.done + +S.act.swap.done;
  $('gcount').textContent=`object ${no} / link ${S.links.length} / action ${na}`;
}

/* ---------- 各ステージ ---------- */
function rawTable(k,n){const d=DS[k];
  return `<div class="tscroll"><table><tr>${d.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${d.rows.slice(0,n||9).map(r=>`<tr>${r.map(v=>`<td class="${typeof v==='number'?'num':''}">${v}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function chips(k,field,cur){return DS[k].cols.map(c=>`<button class="chip ${cur===c?'on':''}" data-a="pick" data-k="${k}" data-f="${field}" data-v="${c}" aria-pressed="${cur===c}">${c}</button>`).join('');}

function vObjects(){
  const cur=ORDER.find(k=>!S.obj[k].done);
  let h=`<div class="lead"><span class="term">Step 1 — Object Type</span><h2>表を「モノ」に翻訳する</h2>
  <p>基幹システムから4つの表が届いた。列名は略語だらけで、現場の人には読めない。まず各表が現実世界の何を表しているかを決めて、オブジェクト型にする。決めるのは2つ。1行を一意に特定する<b>主キー</b>と、人が一覧で見るときの<b>タイトル</b>。</p></div>`;
  for(const k of ORDER){const d=DS[k],o=S.obj[k];
    if(o.done) h+=`<div class="panel"><div class="done-line"><span><span class="dot" ${col(k)}></span><b>${d.name}</b></span><span class="mono">${d.ds}</span><span class="pk">PK ${d.pk}</span><span class="tag ok">定義済み</span></div>
      <div class="row" style="font-size:13px;color:var(--muted)">${d.cols.map(c=>`<span><span class="mono">${c}</span> → ${d.props[c]}</span>`).join('<span>／</span>')}</div></div>`;
    else if(k===cur) h+=`<div class="panel"><div class="row"><h3 class="mono">${d.ds}</h3><span class="sub">これは何の表？ → <b style="color:var(--ink)">${d.name}</b></span></div>
      ${rawTable(k)}
      <div class="row"><span class="lab">主キー</span>${chips(k,'pk',o.pk)}</div>
      <div class="row"><span class="lab">タイトル</span>${chips(k,'title',o.title)}</div>
      ${msgHtml()}
      <div class="row"><button class="btn" data-a="defObj" data-k="${k}">「${d.name}」を定義する</button></div></div>`;
    else h+=`<div class="panel flat"><div class="done-line"><span class="mono">${d.ds}</span><span class="sub">未定義の表（${d.cols.length}列）</span></div></div>`;}
  if(!cur) h+=next('4つの表がオブジェクト型になった。でもまだ互いに孤立している。');
  return h;
}
function next(t){return `<div class="panel"><p>${t}</p><div class="row"><button class="btn" data-a="next">次のステップへ</button></div></div>`;}

function vLinks(){
  const [A,B]=S.ls, full=S.links.length===LINKS.length;
  let h=`<div class="lead"><span class="term">Step 2 — Link Type</span><h2>モノ同士を関係でつなぐ</h2>
  <p>「このフライトはどの機材で飛ぶのか」を、毎回SQLでJOINしなくても辿れるようにする。オブジェクト型を2つ選んで、互いを結びつける列のペアを指定する。リンクは全部で<b>${LINKS.length}本</b>隠れている。</p></div>
  <div class="panel"><div class="row"><span class="lab">つなぐ2つ</span>${ORDER.map(k=>`<button class="chip obj ${S.ls.includes(k)?'on':''}" ${col(k)} data-a="lsel" data-k="${k}" aria-pressed="${S.ls.includes(k)}">${DS[k].name}</button>`).join('')}</div>`;
  if(A&&B&&!full){
    h+=[A,B].map(k=>`<div class="row"><span class="lab">${DS[k].name}の列</span>${DS[k].cols.map(c=>`<button class="chip ${S.lc[k]===c?'on':''}" data-a="lcol" data-k="${k}" data-v="${c}" aria-pressed="${S.lc[k]===c}">${c}${c===DS[k].pk?' <span class="pk">PK</span>':''}</button>`).join('')}</div>`).join('');
    const cs=[['A',`${DS[A].name} 多 : 1 ${DS[B].name}`],['B',`${DS[A].name} 1 : 多 ${DS[B].name}`],['one','1 : 1']];
    h+=`<div class="row"><span class="lab">対応の数</span>${cs.map(([v,t])=>`<button class="chip ${S.card===v?'on':''}" style="font-family:var(--f-body)" data-a="card" data-v="${v}" aria-pressed="${S.card===v}">${t}</button>`).join('')}</div>`;
  } else if(!full) h+=`<p class="sub">オブジェクト型を2つ選ぶと、列の一覧が出る。</p>`;
  h+=msgHtml();
  if(!full) h+=`<div class="row"><button class="btn" data-a="mkLink" ${A&&B?'':'disabled'}>リンクを作成</button><button class="btn ghost" data-a="hint">ヒント</button><span class="grow"></span><span class="sub">${S.links.length} / ${LINKS.length} 本</span></div>`;
  h+=`</div>`;
  if(S.links.length) h+=`<div class="panel"><h3>作成済みのリンク型</h3>${LINKS.filter(L=>S.links.includes(L.id)).map(L=>`<div class="done-line"><b>${L.label}</b><span class="mono">${DS[L.from].ds}.${L.col} → ${DS[L.to].ds}.${DS[L.to].pk}</span><span class="sub">${DS[L.from].name} 多 : 1 ${DS[L.to].name}</span></div>`).join('')}</div>`;
  if(full) h+=next('表の世界が、辿れる網になった。ここまでが「名詞」。次は「動詞」を足す。');
  return h;
}

function sel(id,cur,opts,ph){return `<select id="${id}" data-f="${id}"><option value="">${ph}</option>${opts.map(([v,t])=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`).join('')}</select>`;}
function vActions(){

  <p>見るだけのデータモデルなら、ここで終わり。オントロジーは、人が決断して<b>データを書き換える操作</b>まで型として持つ。誰でも好きに書き換えられると危ないので、実行条件も一緒に決める。</p></div>`;
  h+=`<div class="panel"><h3>アクション①「整備入りにする」</h3><p class="sub">不具合の出た機体を運航から外す。</p>`;

    ${S.msgAt==='g'?msgHtml():''}<div class="row"><button class="btn" data-a="defAct" data-k="ground">アクションを定義する</button></div>`;
  h+=`</div><div class="panel"><h3>アクション②「機材を変更する」</h3><p class="sub">フライトを飛ばす機体を、別の機体に差し替える。</p>`;
  if(w.done) h+=`<div class="done-line"><span class="tag ok">定義済み</span><span>フライト の 使用機材 を、実行者が選んだ航空機に書き換える</span></div><ul class="plain"><li>${RULES.status}</li><li>${RULES.seats}</li></ul>`;
  else h+=`<div class="row"><label class="lab" for="w_obj">対象</label>${sel('w_obj',w.obj,objs,'オブジェクト型を選ぶ')}</div>
    <div class="row"><label class="lab" for="w_prop">書き換える</label>${sel('w_prop',w.prop,props(w.obj),'プロパティを選ぶ')}</div>
    <div class="row"><label class="lab" for="w_val">新しい値</label>${sel('w_val',w.val,[['fixed','常に JA771M（固定値）'],['param','実行者がその場で選ぶ航空機（パラメータ）'],['null','空にする']],'値の決め方を選ぶ')}</div>
    <div><span class="lab">実行条件（満たさないと拒否）</span>${Object.entries(RULES).map(([k,t])=>`<div><label><input type="checkbox" id="r_${k}" data-r="${k}" ${w.rules.includes(k)?'checked':''}> ${t}</label></div>`).join('')}</div>
    ${S.msgAt==='w'?msgHtml():''}<div class="row"><button class="btn" data-a="defAct" data-k="swap">アクションを定義する</button></div>`;
  h+=`</div>`;
  if(g.done&&w.done) h+=next('オントロジーが完成した。ちょうどそのとき、運航管理室の警報が鳴る。');

}

function badFlights(){return S.data.flight.filter(f=>find('aircraft',f.tail_no).status!=='運航可能');}
function opsChecks(){const o=S.ops;return [o.t1,o.t2,o.t3,find('aircraft','JA812T').status==='整備中',
  S.data.flight.every(f=>f.tail_no!=='JA812T')];}

  <div class="panel"><ol class="checks">${T.map((t,i)=>`<li class="${c[i]?'y':''}"><span class="bx">${c[i]?'[済]':'[ '+(i+1)+' ]'}</span><span>${t!==null?t:`この機体が今日運ぶ予定の乗客は合計何人？ `+(c[2]?'<b>507人</b>':`<input type="number" id="pax" inputmode="numeric" value="${o.pax}" style="width:6em" aria-label="乗客数の合計"> <button class="btn ghost" data-a="pax">答える</button>`)}</span></li>`).join('')}</ol>
  ${S.msgAt==='c'?msgHtml():''}</div>
  <div class="panel"><div class="row">${ORDER.map(k=>`<button class="chip obj ${o.tab===k?'on':''}" ${col(k)} data-a="tab" data-k="${k}">${DS[k].name} ${S.data[k].length}</button>`).join('')}</div>

function sub(k,r){return k==='aircraft'?`${r.model}・${r.seats}席・${r.status}`:k==='flight'?`${r.dep_time}発・${r.pax}人・${r.tail_no}`:k==='airport'?`${r.iata}・${r.city}`:`${r.tail_no}・${r.severity}`;}
function item(k,r,lab){const id=r[DS[k].pk],on=S.ops.sel&&S.ops.sel.k===k&&S.ops.sel.id===id;

function detail(){
  const {k,id}=S.ops.sel,d=DS[k],r=find(k,id);

  for(const L of LINKS){
    if(L.from===k){const t=find(L.to,r[L.col]); if(t) h+=item(L.to,t,L.label);}
    if(L.to===k){const xs=S.data[L.from].filter(x=>x[L.col]===id); if(xs.length) h+=xs.map(x=>item(L.from,x,L.rev)).join('');}
  }
  h+=`</div>`;
  if(k==='aircraft') h+=`<div class="row"><span class="lab">アクション</span><button class="btn" data-a="ground" ${r.status!=='運航可能'?'disabled':''}>▸ 整備入りにする</button></div>`;
  if(k==='flight'){h+=`<div class="row"><span class="lab">アクション</span><button class="btn" data-a="pickAc">▸ 機材を変更する</button></div>`;
    if(S.ops.picking) h+=`<div class="list"><span class="sub">代替機を選ぶ（乗客 ${r.pax}人）</span>${S.data.aircraft.filter(a=>a.tail_no!==r.tail_no).map(a=>`<button class="item" ${col('aircraft')} data-a="swap" data-id="${a.tail_no}"><b>${a.tail_no}</b><small>${sub('aircraft',a)}</small></button>`).join('')}</div>`;}
  if(S.msgAt==='d') h+=msgHtml();
  return h;
}

/* ---------- 描画と操作 ---------- */
let started=false;
function render(){
  const st=S.stage;
  $('steps').innerHTML=STEPS.map((t,i)=>`<li class="${started&&i===st?'now':started&&i<st?'done':''}">${t}</li>`).join('');
  $('main').innerHTML=!started?vIntro():[vObjects,vLinks,vActions,vOps,vResult][st]();
  drawGraph();
}
function linkAttempt(){
  const [A,B]=S.ls,a=S.lc[A],b=S.lc[B];
  if(!a||!b) return say('両方のオブジェクト型から、対応する列を1つずつ選ぶ。');
  if(!S.card) return say('対応の数（多:1 など）を選ぶ。');
  const between=LINKS.filter(L=>(L.from===A&&L.to===B)||(L.from===B&&L.to===A));
  if(!between.length) return miss(`${DS[A].name}と${DS[B].name}には、互いを直接指す列がない。無理につながなくていい。別のオブジェクト型を経由すれば辿れる。`);
  const L=between.find(L=>L.from===A?(L.col===a&&b===DS[B].pk):(L.col===b&&a===DS[A].pk));
  if(!L){
    if(a!==DS[A].pk&&b!==DS[B].pk) return miss('どちらの列も相手の主キーではない。リンクは「片方の列（外部キー）→ 相手の主キー」の形で張る。');
    return miss(`<span class="mono">${a}</span> の値は「${DS[A].rows[0][DS[A].cols.indexOf(a)]}」、<span class="mono">${b}</span> の値は「${DS[B].rows[0][DS[B].cols.indexOf(b)]}」。同じモノを指す列同士を選ぶ。`);
  }
  if(S.links.includes(L.id)) return say('そのリンクは作成済み。同じ2つの間に、別の意味のリンクがもう1本あるかもしれない。');
  if(S.card!==(L.from===A?'A':'B')) return miss(`<span class="mono">${DS[L.from].ds}.${L.col}</span> には同じ値が何度も出てくる。つまり1つの${DS[L.to].name}に対して${DS[L.from].name}は複数ある。`);
  S.links.push(L.id); S.lc={}; S.card=null;
  say(`リンク型「<b>${L.label}</b>」を作成した。${DS[L.from].name}から${DS[L.to].name}へ、逆向きにも辿れる。`,true);
  if(S.links.length===LINKS.length){S.ls=[];S.msg=null;}
}
function defAct(k){
  const a=S.act[k]; S.msgAt=k==='ground'?'g':'w';
  if(!a.obj||!a.prop||!a.val) return say('対象・プロパティ・値をすべて選ぶ。');
  if(k==='ground'){
    if(a.obj!=='aircraft') return miss('止めたいのは機体そのもの。フライトやアラートを書き換えても、機体は運航可能のまま残る。');
    if(a.prop!=='status') return miss('運航に使えるかどうかを表しているプロパティはどれ？');
    if(a.val!=='整備中') return miss('不具合を直す間だけ運航から外したい。直ったら戻す前提の値を選ぶ。');
  } else {
    if(a.obj!=='flight') return miss('差し替わるのは「このフライトをどの機体で飛ばすか」。書き換わるのはフライト側。');
    if(a.prop!=='tail_no') return miss('フライトと航空機をつないでいる列はどれだった？ そこを書き換えるとリンク先が変わる。');
    if(a.val!=='param') return miss(a.val==='fixed'?'固定値だと、JA771M が使えない日にこのアクションが役に立たない。':'空にすると、機材のないフライトが生まれる。');
    const r=a.rules;
    if(!r.includes('status')) return miss('このままだと、整備中の機体を代替機に選べてしまう。');
    if(!r.includes('seats')) return miss('このままだと、177人の便に95席の機体を割り当てられてしまう。');
    if(r.includes('model')) return miss('機種が違っても、席が足りて運航可能なら飛ばせる。条件を厳しくしすぎると現場が動けなくなる。');
    if(r.includes('exec')) return miss('障害対応は運航管理者がその場で打つ手。部長の承認待ちにすると間に合わない。');
  }
  a.done=true; S.msg=null;
}
function open(k,id){const o=S.ops;o.sel={k,id};o.tab=k;o.picking=false;S.msg=null;
  if(k==='alert'&&id==='A-501')o.t1=true; if(k==='aircraft'&&id==='JA812T'&&o.t1)o.t2=true;}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const {a,k,v,f,id}=b.dataset;
  if(a==='start'){started=true;}
  else if(a==='reset'){S=fresh();started=false;}
  else if(a==='next'){S.stage++;S.msg=null;S.msgAt=null;window.scrollTo(0,0);}
  else if(a==='pick'){S.obj[k][f]=v;S.msg=null;}
  else if(a==='defObj'){const d=DS[k],o=S.obj[k];
    if(!o.pk||!o.title) say('主キーとタイトルを両方選ぶ。');
    else if(o.pk!==d.pk){const i=d.cols.indexOf(o.pk),vals=d.rows.map(r=>r[i]),dup=vals.find((x,j)=>vals.indexOf(x)!==j);
      miss(d.pkHint[o.pk]||(dup!==undefined?`<span class="mono">${o.pk}</span> は「${dup}」が複数の行にある。主キーは1行を一意に特定できる列でないといけない。`:'今は重複していないが、IDとして発番された列ではない。'));}
    else if(!d.title.includes(o.title)) miss(d.titleHint[o.title]||'タイトルは、人が一覧で見てそのモノだと分かる名前にする。');
    else {o.done=true;S.msg=null;}}
  else if(a==='lsel'){const i=S.ls.indexOf(k); if(i>=0)S.ls.splice(i,1); else {if(S.ls.length===2)S.ls.shift();S.ls.push(k);} S.lc={};S.card=null;S.msg=null;}
  else if(a==='lcol'){S.lc[k]=v;}
  else if(a==='card'){S.card=v;}
  else if(a==='mkLink'){linkAttempt();}
  else if(a==='hint'){const L=LINKS.find(L=>!S.links.includes(L.id));S.miss++;say(`${DS[L.from].name}の表に、${DS[L.to].name}の主キーと同じ種類の値が入った列がある。`,true);}
  else if(a==='defAct'){defAct(k);}
  else if(a==='tab'){S.ops.tab=k;}
  else if(a==='open'){open(k,id);}
  else if(a==='pax'){S.msgAt='c';const n=Number(S.ops.pax);
    if(!S.ops.t2) say('先にアラートから機体まで辿る。機体を開くと「担当フライト」が並ぶ。');
    else if(n===507){S.ops.t3=true;say('172 + 158 + 177 = 507人。3便すべてが同じ機体に依存していた。',true);}
    else miss('JA812T の「担当フライト」に並ぶ便の乗客数を合計する。');}
  else if(a==='ground'){find('aircraft',S.ops.sel.id).status='整備中';S.msgAt='d';say('アクション実行：状態を「整備中」に書き換えた。この機体に紐づくフライトに「機材なし」の警告が出ている。',true);}
  else if(a==='pickAc'){S.ops.picking=!S.ops.picking;S.msg=null;}
  else if(a==='swap'){const fl=find('flight',S.ops.sel.id),ac=find('aircraft',id);S.msgAt='d';
    if(ac.status!=='運航可能'){S.rejected++;say(`<b>アクション拒否：</b>${ac.tail_no} は「${ac.status}」。実行条件「${RULES.status}」を満たさない。`);}
    else if(ac.seats<fl.pax){S.rejected++;say(`<b>アクション拒否：</b>${ac.tail_no} は ${ac.seats}席、このフライトは ${fl.pax}人。実行条件「${RULES.seats}」を満たさない。`);}
    else {fl.tail_no=ac.tail_no;S.ops.picking=false;say(`アクション実行：${fl.flt_no} の使用機材を ${ac.tail_no} に変更した。`,true);}}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){const [p,f]=t.dataset.f.split('_'),a=S.act[p==='g'?'ground':'swap'];a[f]=t.value;if(f==='obj')a.prop='';S.msg=null;render();}
  else if(t.dataset.r){const r=S.act.swap.rules,i=r.indexOf(t.dataset.r);if(t.checked&&i<0)r.push(t.dataset.r);if(!t.checked&&i>=0)r.splice(i,1);}
});
document.addEventListener('input',e=>{if(e.target.id==='pax')S.ops.pax=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pax')document.querySelector('[data-a="pax"]').click();});

function boot(d){if(d&&d.S){S=d.S;started=!!d.started;}render();}
window.claude?.hot?.snapshot?.(()=>({S,started}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
